name: stock-analysis
on:
  workflow_dispatch:
jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install dep
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas tushare

      - name: run script
        env:
          ANSPIRE_API_KEY: ${{ secrets.ANSPIRE_API_KEY }}
        run: python main.py
